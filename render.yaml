# Render Blueprint for the backend (Render → New → Blueprint → this repo).
# The frontend is on Vercel; see docs/DEPLOY.md.
services:
  - type: web
    name: spotter-backend
    runtime: python
    plan: free
    rootDir: backend
    # uv builds .venv with Render's own Python; downloading one is off, because a downloaded
    # Python lives outside the project folder and may be gone when the app starts.
    buildCommand: pip install uv && UV_PYTHON_DOWNLOADS=never uv sync --frozen --no-dev --python python3
    # 1 worker so the in-memory weather cache is shared; threads serve requests waiting on APIs.
    startCommand: .venv/bin/gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60 --access-logfile -
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: HERE_API_KEY
        sync: false # asked for when the Blueprint is created
      - key: ALLOWED_HOSTS
        sync: false # the Render address, e.g. spotter-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the Vercel address, e.g. https://spotter-routing.vercel.app
